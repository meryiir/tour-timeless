# Migrate legacy ?lang=xx URLs to language-prefixed paths.
map $arg_lang $legacy_lang_prefix {
    default "/en";
    en "/en";
    fr "/fr";
    es "/es";
    de "/de";
}

# SPA + reverse proxy to Spring Boot (same-origin /api and /uploads as in Vite dev).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Caddy terminates TLS in front of this HTTP container. Keep redirect
    # locations relative so nginx cannot downgrade public HTTPS URLs to HTTP.
    absolute_redirect off;

    client_max_body_size 64M;

    # Basic security headers (safe defaults; TLS/HSTS should be handled by your HTTPS terminator).
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Enforce non-www as the single canonical host.
    if ($host ~* ^www\.(?<apex>.+)$) {
        return 301 https://$apex$request_uri;
    }

    # Long-cache versioned build assets.
    location ~* \.(?:css|js|mjs|map|json|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location ^~ /api {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location = /robots.txt {
        proxy_pass http://backend:8081/api/seo/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://backend:8081/api/seo/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Unknown activity/destination slugs → real 404 (seo-slugs.conf generated at build).
    location ~ ^/(?:en|fr|es|de)/activities/[^/]+/?$ {
        if ($seo_activity_slug_valid = 0) { return 404; }
        try_files /index.html =404;
    }

    # One trailing-slash form only: /fr/about/ → /fr/about.
    location ~ ^(/(?:en|fr|es|de)(?:/.*[^/])?)/$ {
        return 301 $1$is_args$args;
    }

    location ~ ^/(?:en|fr|es|de)/destinations/[^/]+/?$ {
        if ($seo_destination_slug_valid = 0) { return 404; }
        try_files /index.html =404;
    }

    # Canonical language-prefixed public and account routes.
    location ~ ^/(?:en|fr|es|de)(?:/|$) {
        try_files $uri $uri/index.html /index.html =404;
    }

    # Preserve query filters on unprefixed URLs; legacy lang parameters become
    # a clean path redirect and intentionally drop the obsolete parameter.
    location / {
        if ($arg_lang = "") { return 301 /en$uri$is_args$args; }
        return 301 $legacy_lang_prefix$uri;
    }
}
